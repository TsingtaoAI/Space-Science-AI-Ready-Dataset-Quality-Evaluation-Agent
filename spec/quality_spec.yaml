    profiles: [any]
    method: 数据文件内容 SHA-256 不重复（先按大小分组）；不比较标签内容（无标注样本的标签天然相同）

  # --- 物理与逻辑一致性（单数据集即可判定；没有同源版本时仍能检出内容性缺陷）---
  - id: V04
    name: CME 动能与质量、速度自洽
    defect_type: T8
    defect_code: L2-B
    applicability: "同时给出质量、线速度、动能的 CME 事件"
    boundary: "三者不全 → 不适用；结论属结构参数失配（不可重推），一律弃报为待判定"
    dimension: annotation
    remediation: 按 LASCO CME 目录核对质量、线速度与动能，恢复被扰动的数值
    category: value_perturbation
    evidence_type: computable
    severity: major
    profiles: [hek_image]
    depends_on: [S05]
    method: "|ln(动能 / (0.5 × 质量 × 线速度²))| <= ln(1 + physics.kinetic_energy_tolerance)；质量以 g、速度以 km/s 计"
  - id: B03
    name: 目标中心位于日面内
    defect_type: T6
    defect_code: L2-G
    applicability: "有多边形的 HEK 事件；须有太阳视半径 rsunObs"
    boundary: "无多边形 → 不适用；rsunObs 缺失 → 待判定"
    dimension: annotation
    remediation: 核对多边形坐标是否被平移、镜像或旋转，按原始事件坐标修正
    category: boundary_offset
    evidence_type: computable
    severity: major
    profiles: [hek_image]
    depends_on: [V02]
    method: "多边形中心到图像中心的距离 <= physics.limb_margin × 日面半径；日面半径 = rsunObs / 像素尺度（有 wavelnth 的 AIA 取 0.6″/px，否则 HMI 取 0.504″/px，按 4096 / 实际宽度缩放）；图像中心取实际尺寸的一半"
  - id: B04
    name: 目标框面积与像素数相符
    defect_type: T6
    defect_code: L3-MIS
    applicability: "同时给出多边形与 event_npixels 的 HEK 事件"
    boundary: "两者不全 → 不适用"
    dimension: annotation
    remediation: 核对多边形是否被缩放，按事件像素数重新生成边界
    category: boundary_offset
    evidence_type: computable
    severity: major
    profiles: [hek_image]
    depends_on: [V02]
    method: 多边形像素面积 / event_npixels 落在 physics.area_ratio_range 内
  - id: C04
    name: 事件类型与来源目录一致
    defect_type: T4
    defect_code: L2-P
    applicability: "ULF 事件，来源目录名中含事件类型"
    boundary: "来源目录名中无可识别的事件类型 → 不适用"
    dimension: annotation
    remediation: 按来源事件目录修正事件类型
    category: category_error
    evidence_type: computable
    severity: major
    profiles: [ulf_timeseries]
    depends_on: [S05]
    method: 来源目录名中出现的事件类型（如 p2pi2 → Pi2）必须包含该事件的类型
  - id: C05
    name: 同一事件在不同样本中的类别一致
    defect_type: T4
    defect_code: L2-P
    applicability: "无同源质量版本的数据集；同一事件（同身份标识，或同一帧组）出现在 ≥ cross_sample.min_occurrences 个样本中"
    boundary: "有同源质量版本 → 不适用（由 X03 覆盖）；出现次数不足或没有多数一致的取值 → 该事件不判"
    dimension: annotation
    remediation: 按同一事件在其他样本中的一致标注修正该样本的类别，或核对源事件目录
    category: category_error
    evidence_type: computable
    severity: critical
    profiles: [hek_image]
    run_when: no_variant_group
    method: >-
      按 cross_sample 的分组方式（同身份标识的事件，或同一 image_time 的帧组）收集同一事件在各样本中的类别字段，
      取严格多数（> 一半）的取值为参考，与之不同的样本判类别错标；没有严格多数时不判。本样本的取值若正是全数据集该字段的严格多数
      取值（数据集定位），说明是同一事件在多数样本中被改写，不判本样本（错标由 C06 在被改写的样本上报出）
  - id: C06
    name: 类别与数据集定位相符
    defect_type: T4
    defect_code: L2-P
    applicability: "事件标注型数据集，类别标注 ≥ positioning.min_elements 个，且有占严格多数的类别"
    boundary: "有同源质量版本 → 不适用（由 X03 覆盖）；没有严格多数的类别（多类别数据集）→ 不适用"
    dimension: annotation
    remediation: 核对与数据集定位不符的事件，改回正确类别或从本数据集移除
    category: category_error
    evidence_type: computable
    severity: critical
    profiles: [hek_image]
    run_when: no_variant_group
    method: >-
      统计数据集内全部事件的类别（事件级 concept / event_type，事件无类别时取帧级 event_types），占严格多数（> positioning.min_share）
      的类别即数据集定位；类别与之不同的事件判类别错标。依据：活动区数据集只应含活动区事件（公开集干净版本 100% 为
      Active Region，CME 数据集 100% 为 CME），发榜方路演说明以「类别为 Coronal Hole，与数据集定位不符」为例
  - id: B05
    name: 同一事件在不同样本中的时刻一致
    defect_type: T6
    defect_code: L2-T
    applicability: "无同源质量版本的数据集；同一事件出现在 ≥ cross_sample.min_occurrences 个样本中"
    boundary: "有同源质量版本 → 不适用（由 X06 覆盖）；出现次数不足或没有多数一致的取值 → 该事件不判"
    dimension: annotation
    remediation: 按同一事件在其他样本中的一致时刻修正该样本的事件时刻
    category: boundary_offset
    evidence_type: computable
    severity: critical
    profiles: [hek_image]
    run_when: no_variant_group
    method: >-
      同 C05 的分组；比较事件时刻字段（cross_sample.time_fields），与严格多数取值不同的样本判时段抖动，程度为与多数取值的时间差；
      其余数值字段（cross_sample 中未列为类别或时刻的字段）与多数不同时属标量数值扰动，按不可重推项弃报为待判定

  # --- 质量变体对照（同源版本间逐样本比较，参考选择见 variants）---
  - id: X01
    name: 样本相对同源版本整体缺失
    defect_type: T1
    defect_code: L0-01
    applicability: "有同源质量版本（同标注族、样本名 Jaccard ≥ min_jaccard）的数据集"
    boundary: "无同源版本 → 不适用；参与比较的版本 < min_agree → 差异落待判定；没有有效参考内容 → 待判定"
    dimension: completeness
    remediation: 从参考版本补回缺失样本，或在版本说明中声明删减
    category: file_pairing
    evidence_type: computable
    severity: critical
    profiles: [any]
    method: 参考版本中存在、本版本标签与数据均不存在的样本
  - id: X02
    name: 数据内容与参考版本一致
    defect_type: T1
    defect_code: E-COR
    applicability: "有同源质量版本（同标注族、样本名 Jaccard ≥ min_jaccard）的数据集"
    boundary: "无同源版本 → 不适用；参与比较的版本 < min_agree → 差异落待判定；没有有效参考内容 → 待判定"
    defect_code_by_profile: {ulf_timeseries: L1-TS}
    dimension: completeness
    remediation: 以参考版本为准恢复被改动的数据，或说明改动原因
    category: value_perturbation
    evidence_type: computable
    severity: major
    profiles: [any]
    method: 数据文件指纹（<=8MB 全量 SHA-256，否则 大小 + 首尾各 1MB）与参考版本不同；时序数据给出采样点增删与改动行数
  - id: X03
    name: 类别与参考版本一致（类别错标）
    defect_type: T4
    defect_code: L2-P
    applicability: "有同源质量版本（同标注族、样本名 Jaccard ≥ min_jaccard）的数据集"
    boundary: "无同源版本 → 不适用；参与比较的版本 < min_agree → 差异落待判定；没有有效参考内容 → 待判定"
    dimension: annotation
    remediation: 按参考版本修正类别，争议样本转专家复核
    category: category_error
    evidence_type: computable
    severity: critical
    profiles: [any]
    method: 元素匹配后类别与参考版本不同
  - id: X04
    name: 无漏标（相对同源版本）
    defect_type: T5
    defect_code: L3-06
    applicability: "有同源质量版本（同标注族、样本名 Jaccard ≥ min_jaccard）的数据集"
    boundary: "无同源版本 → 不适用；参与比较的版本 < min_agree → 差异落待判定；没有有效参考内容 → 待判定"
    dimension: annotation
    remediation: 补标参考版本中存在的目标
    category: missing_spurious
    evidence_type: computable
    severity: critical
    profiles: [any]
    method: 参考版本中的标注元素在本版本无法匹配
  - id: X05
    name: 无虚标（相对同源版本）
    defect_type: T5
    defect_code: L3-07
    applicability: "有同源质量版本（同标注族、样本名 Jaccard ≥ min_jaccard）的数据集"
    boundary: "无同源版本 → 不适用；参与比较的版本 < min_agree → 差异落待判定；没有有效参考内容 → 待判定"
    dimension: annotation
    remediation: 删除多余标注，或提供该目标存在的依据
    category: missing_spurious
    evidence_type: computable
    severity: critical
    profiles: [any]
    method: 本版本的标注元素在参考版本中无法匹配
  - id: X06
    name: 位置/边界无偏移（相对同源版本）
    defect_type: T6
    defect_code: L2-G
    applicability: "有同源质量版本（同标注族、样本名 Jaccard ≥ min_jaccard）的数据集"
    boundary: "无同源版本 → 不适用；参与比较的版本 < min_agree → 差异落待判定；没有有效参考内容 → 待判定"
    dimension: annotation
    remediation: 按参考版本修正框、分割或事件时段的位置
    category: boundary_offset
    evidence_type: computable
    severity: critical
    profiles: [any]
    method: 匹配元素的几何中心偏移、面积比，或事件起止时刻偏移；给出严重度两轴
  - id: X07
    name: 声明字段与参考版本一致
    defect_type: T10
    defect_code: E-DOC
    applicability: "有同源质量版本（同标注族、样本名 Jaccard ≥ min_jaccard）的数据集"
    boundary: "无同源版本 → 不适用；参与比较的版本 < min_agree → 差异落待判定；没有有效参考内容 → 待判定"
    dimension: provenance
    remediation: 按参考版本修正被改动的声明字段
    category: doc_mismatch
    evidence_type: computable
    severity: major
    profiles: [any]
    method: 除标注元素外的标签字段与参考版本不同；已被单数据集检查报告的同一路径不重复报告

  - id: X08
    name: 标注数值与参考版本一致（数值扰动）
    defect_type: T8
    defect_code: L2-A
    applicability: "有同源质量版本（同标注族、样本名 Jaccard ≥ min_jaccard）的数据集"
    boundary: "无同源版本 → 不适用；参与比较的版本 < min_agree → 差异落待判定；没有有效参考内容 → 待判定"
    dimension: annotation
    remediation: 按参考版本恢复被扰动的标注数值（速度、面积、通量等），确认其来源
    category: value_perturbation
    evidence_type: computable
    severity: major
    profiles: [any]
    method: 匹配元素的数值属性与参考版本不同；同一元素的多个字段合并为一条，给出最大相对偏差

  # --- 覆盖与分布、使用条件 ---
  - id: G01
    name: 类别分布与同源版本一致
    defect_type: T5
    defect_code: E-COV
    applicability: "有同源质量版本的数据集"
    boundary: "参考或本版本没有带类别的标注元素 → 不适用"
    dimension: coverage
    remediation: 检查类别分布偏移的来源（漏标、错标或样本删减），修正后重新统计
    category: missing_spurious
    evidence_type: computable
    severity: minor
    profiles: [any]
    method: 本版本标注类别直方图与参考版本类别直方图的总变差距离 <= coverage.max_tvd
  - id: U01
    name: 使用权限与用途声明
    defect_type: T10
    defect_code: E-USE
    applicability: "数据集整体"
    boundary: "目录中没有使用权限 / 许可 / 用途说明文件 → 待判定"
    dimension: usage
    remediation: 补充使用权限、许可与适用用途说明文件
    category: doc_mismatch
    evidence_type: undeterminable
    severity: minor
    profiles: [any]
    method: 数据集中存在使用权限、许可或用途说明文件（usage.doc_globs）；没有时落待判定，所在维度按证据不足处理

# 质量变体对照参数
variants:
  min_jaccard: 0.5   # 同族数据集样本名集合的 Jaccard 相似度达到该值才视为同源版本
  min_agree: 3       # 至少该数量的同源版本参与比较，差异才可能被确认为缺陷
  # 参考选择（公开集实测：注入缺陷在质量档之间部分嵌套，同一缺陷常出现在 3 个以上版本中，单纯多数投票会冤枉好版本）：
  #   ① 用下列「独立检查」的不通过单元数给组内版本排质量序（不依赖版本对照）；
  #   ② 某版本该样本的记录被独立检查判为不通过，其内容不能作参考；
  #   ③ 取质量序最靠前、内容有效的版本为参考，除非它孤立（仅它一个）且另有有效内容获得 min_agree 个以上版本支持——此时落待判定；
  #   ④ 参与比较的版本少于 min_agree 时，差异一律落待判定。
  reference_checks: [S01, S02, S03, S05, S06, P01, P02, V01, V02, V03,
                     C01, C02, C04, B01, B03, B04, V04, N03, D01, D02]
  # 同一样本在所有同源版本中都被同一检查判为不通过：属基础数据特性而非版本缺陷，降级为待判定
  downgrade_common_findings: true
  # 参考版本（质量序第一）上同一样本、同一位置、同一判据也不通过的单数据集结论：属来源固有问题，降级为待判定
  # （公开集「clean 档覆盖 0%」；源数据中本已存在的少量问题不计入任何档位，见评分标准附件一）
  downgrade_reference_findings: true
  # 几何变化的细分（X06）：中心几乎不动而面积明显变化 = 标注范围被放大/缩小（L3-MIS），否则为位置/边界偏差（L2-G）。
  # 公开集标定：AIA/HMI 的 P1（不含 L3-MIS）满足该条件的仅 0～2 处，P4 为 512～629 处；EPB/DMSP 无 L3-MIS，顶点抖动
  # 也会带来面积小幅变化，故只对外接框类标注（hek_image）启用
  coverage_change: {max_offset_norm: 0.1, min_abs_log_area: 0.15, profiles: [hek_image]}
  # 同一样本内参考与本版本都有未匹配的元素时，先按「身份字段相同」或「两侧数量相等且无身份字段」一一配对，
  # 判为偏移（X06）而非一漏一虚：公开集 CME 无坐标框、全档不含漏标与虚标，大幅时间抖动曾被误拆为漏标 + 虚标
  pair_leftovers: true
  # 元素匹配：① 身份字段（profiles.*.events.identity_keys）完全相同者直接配对；② 内容完全相同者配对；
  # ③ 其余按 几何中心距离/目标尺度 + 时间偏移/时长 + 其余属性差异比例 + 类别不同 0.3 贪心配对，代价 > 2.0 视为不同目标

# 严重度（评分准则 §2.4：同一形态内两轴归一后 1:1）
severity_axes:
  image: {axes: [position_offset, area_ratio],
          position_offset: "min(1, 中心偏移像素 / sqrt(参考外接框面积))",
          area_ratio: "min(1, |ln(面积比)|)"}
  time:  {axes: [time_offset, relative_deviation],
          time_offset: "min(1, 起止时刻最大偏移秒 / 3600)",
          relative_deviation: "min(1, 偏移 / 参考时长)"}
  timeseries: {axes: [time_offset, sample_points],
               time_offset: "min(1, 声明起止时刻偏移秒 / 3600)",
               sample_points: "min(1, |采样点增删| / 参考点数)"}

# 缺陷程度（数据集级比例，分子分母均写入报告，可复算）
measures:
  missing_ratio:    {zh: 缺失比例,     numerator: "无数据文件的标签 + 相对同源版本整体缺失的样本 + 文件清单列出而缺失的文件", denominator: "参考样本数（无同源版本时为标签数）", checks: [P01, X01, P04], weight: 3}
  corrupt_ratio:    {zh: 损坏与数据改动比例, numerator: "损坏或内容被改动的数据文件", denominator: "数据文件数", checks: [N03, N02, X02], weight: 2}
  mislabel_ratio:   {zh: 错标比例,     numerator: "类别错误的标注元素", denominator: "参考标注元素数", checks: [C01, C02, C04, X03, C05, C06], weight: 3}
  perturbation_ratio: {zh: 标注数值扰动比例, numerator: "数值属性被扰动的标注元素", denominator: "参考标注元素数", checks: [X08, V04], weight: 2}
  omission_ratio:   {zh: 漏标比例,     numerator: "漏标元素", denominator: "参考标注元素数", checks: [X04], weight: 3}
  spurious_ratio:   {zh: 虚标比例,     numerator: "虚标元素", denominator: "本版本标注元素数", checks: [X05, M01, M03, M04], weight: 3}
  offset_ratio:     {zh: 位置/边界偏移比例, numerator: "发生偏移的元素", denominator: "参考中有几何或时间的元素数", checks: [X06, B01, B02, B03, B04, B05], weight: 3}
  duplicate_ratio:  {zh: 重复比例,     numerator: "内容重复的数据文件", denominator: "样本数", checks: [R01], weight: 2}
  structure_ratio:  {zh: 结构与引用错误比例, numerator: "结构不自洽或引用错误的标签", denominator: "标签数", checks: [S01, S02, S05, S06, P02, P03, V01, V02, V03], weight: 2}
  doc_ratio:        {zh: 文档与内容不一致比例, numerator: "声明与内容或同源版本不符的标签", denominator: "标签数", checks: [D01, D02, D03, X07, S03, S04], weight: 1}
  distribution_shift: {zh: 类别分布偏移, numerator: "本版本与参考类别直方图的总变差距离", denominator: "1（距离本身在 [0,1]）", checks: [G01], weight: 1}
  usage_info:       {zh: 使用条件缺失, numerator: "U01 不通过记 1，通过记 0", denominator: "1", checks: [U01], weight: 1}

# 覆盖与分布
coverage:
  max_tvd: 0.02        # 类别直方图总变差距离容差；超过即判 G01 不通过

# 使用条件：识别为使用权限/用途说明的文件
usage:
  doc_globs: ["LICENSE*", "license*", "*许可*", "*权限*", "*用途*", "*usage*", "*USAGE*", "README*", "readme*", "*说明*"]

# 同一事件跨样本一致（C05 / B05，只在没有同源质量版本时运行）。依据：发榜方参考代码 viz_cme_c2.py
# 「同一 image_time 的三帧为一组，相邻帧的 hek 标注与中心帧一致」；AIA 同一 HEK 事件（kb_archivid）平均出现在约 9 张图像中。
# 公开集实测：clean 版两种分组都 0 处不一致；P1～P4 依次增多（CME 帧组 273 / 887 / 1422 / 1661，AIA 事件类别 15 / 293 / 1133 / 1546）
# 数据集定位（C06）：占严格多数的类别即定位，与之不同的类别判错标
positioning:
  element_fields: [concept, event_type]
  block_field: hek_event_annotation.event_types
  min_elements: 30
  min_share: 0.5

cross_sample:
  min_occurrences: 3
  groups:
    hek_image:
      - {by: element_identity, key: kb_archivid, category_fields: [event_type, concept], time_fields: [event_starttime, event_endtime]}
      - {by: block_value, key: hek_event_annotation.image_time, category_fields: [event_types, event_count],
         time_fields: [cme_time], element_list: hek_event_annotation.matched_events}

# 模型服务（可选）：只在 --use-llm 时启用，默认关闭（模型服务消耗 0）。地址、密钥、模型名由评测平台以
# LLM_BASE_URL / LLM_API_KEY / LLM_MODEL 注入，缺失即退出（退出码 5）。模型只做两件事，均不参与计量、计分与排序：
#   doc_claim_extractor  读说明文档，抽取可核对的声明（D04 的输入）；比对与判定由确定性程序完成
#   remediation_writer   把评分卡主要缺陷的整改建议改写得更具体；只写入评分卡说明字段，不影响任何结论与分数
llm:
  temperature: 0
  agreement_calls: 2          # 同一文档抽取次数；只采用各次完全一致的声明，全部不一致时落待判定
  max_doc_chars: 20000        # 单个文档送入模型的最大字符数，超出部分截断并在证据中注明
  doc_globs: ["README*", "readme*", "*.md", "*.rst", "*说明*.txt", "*说明*.md", "dataset_summary*.json"]
  claim_fields: [sample_count, categories, time_range, image_size, modality]
  tolerances: {sample_count_ratio: 0.01, time_range_s: 86400}
  prompts:
    doc_claim_extractor: |-
      你是数据审核助手。下面是一个科学数据集的说明文档。请只抽取文档中明确写出的下列声明，没写的不要推测：
      sample_count（样本数，整数）、categories（声称包含的类别名称列表）、time_range（声称覆盖的起止时间，ISO 8601 两个字符串）、
      image_size（图像宽高，两个整数）、modality（image 或 timeseries）。
      每条声明必须附 quote：从文档中逐字复制的、支持该声明的一句原文。
      只输出 JSON，格式：{"claims": [{"field": "...", "value": ..., "quote": "..."}]}；没有任何声明时输出 {"claims": []}。
    remediation_writer: |-
      你是科学数据质量顾问。下面是一个数据集质量检查发现的一类问题，包括检查名称、缺陷类型、数量、示例说明和通用整改建议。
      请用不超过 80 个汉字写出更具体、可执行的整改步骤（谁来做、改哪里、怎么验证），不要编造数据中没有的事实，不要给出分数或结论。
      只输出整改步骤正文。

# 检查器执行：异常时重试，仍失败则该检查对相关单元落待判定并记入运行日志
execution:
  retry_limit: 1

# 六个评价维度（评分准则 §3.2 最低质量线第 1 条）
dimensions:
  completeness:   {zh: 完整性,         weight: 3, measures: [missing_ratio, corrupt_ratio]}
  annotation:     {zh: 标注质量,       weight: 3, measures: [mislabel_ratio, omission_ratio, spurious_ratio, offset_ratio, perturbation_ratio]}
  correspondence: {zh: 样本对应关系,   weight: 2, measures: [structure_ratio, duplicate_ratio]}
  coverage:       {zh: 覆盖与分布,     weight: 1, measures: [distribution_shift]}
  provenance:     {zh: 文档与来源追溯, weight: 1, measures: [doc_ratio]}
  usage:          {zh: 使用条件,       weight: 1, measures: [usage_info]}

# 质量等级（暂定：未获取档位标签文件，阈值未经标定；报告中的等级带 provisional 标记）
# 档位锚点：发榜方附件一 A2 给出的各档注入覆盖率；评分卡的「质量预测」取估计覆盖率最接近的档位
tier_anchors: {clean: 0.0, P1: 0.05, P2: 0.20, P3: 0.40, P4: 0.60}
grades_provisional: true
grades:
  - {id: high,   zh: 高, min_score: 95, max_key_defect_ratio: 0.01}
  - {id: medium, zh: 中, min_score: 85, max_key_defect_ratio: 0.10}
  - {id: low,    zh: 低, min_score: 0}
# 关键缺陷：severity 为 critical 的检查判出的缺陷。单独列示，关键缺陷比例 = 受关键缺陷影响的样本 / 样本数。
# 关键缺陷比例超过某档上限的数据集不得评为该档，即关键缺陷不能被其他维度的高分抵消。

scoring:
  severity_weights: {critical: 3.0, major: 2.0, minor: 1.0}
  # 维度分 S_d = 100 × (1 − Σ_k w_k · r_k · f_k / Σ_k w_k)，k 取该维度下可计算的程度指标
  #   r_k：measures 中第 k 项比例；f_k：严重度因子，offset_ratio 取 0.5 + 0.5 × 偏移元素平均严重度，其余为 1
  #   维度下没有可计算指标时 S_d 记为「证据不足」，不按 0 分或满分计入综合分
  # 综合分 = Σ_d W_d · S_d / Σ_d W_d，d 取有得分的维度
  # 等级按 grades 自上而下匹配：综合分达到下限且关键缺陷比例不超过上限
  # 全局排序：按综合分降序；分差 < 1e-9 时依次比较 关键缺陷单元数、最大单项比例、数据集标识，保证不输出并列
  # 组内排序：同一质量变体组（无变体时为同一标注族）内按同一规则排序
