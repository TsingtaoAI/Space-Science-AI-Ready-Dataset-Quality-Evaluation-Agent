    category: doc_mismatch
    evidence_type: computable
    severity: minor
    profiles: [any]
    depends_on: [S03]
    method: fileFormat 与扩展名一致（不区分大小写）；modality 与标注族一致；startTime 与 dateObs 一致
  - id: D04
    name: 说明文档的声明与数据内容一致
    defect_type: T10
    defect_code: E-DOC
    applicability: "数据集目录中有说明文档（llm.doc_globs）；文档声明的抽取须启用模型服务（--use-llm）"
    boundary: "没有说明文档 → 不适用；有文档但未启用模型服务、模型调用失败或两次抽取不一致 → 待判定；抽取出的声明在文档中找不到原文 → 丢弃该声明"
    dimension: provenance
    remediation: 修正说明文档中与数据不符的声明，或补齐文档声称覆盖而实际缺失的类别、时段与样本
    category: doc_mismatch
    evidence_type: computable
    severity: major
    profiles: [any]
    depends_on: [S02]
    method: >-
      子代理 doc_claim_extractor 只负责「读」：从说明文档中抽取 llm.claim_fields 列出的声明，每条附文档原文摘录；
      摘录须逐字出现在文档中，否则丢弃。同一文档调用 llm.agreement_calls 次，只采用各次完全一致的声明。
      比对由确定性程序完成：样本数（相对偏差 > llm.tolerances.sample_count_ratio）、类别（文档声称的类别在全部标注中
      一次也没出现）、时段（声称覆盖的时段超出数据实际起止 > llm.tolerances.time_range_s）、图像尺寸（与实际尺寸都不同）、
      模态（与标注族模态不同）；不符即不通过，证据为文档位置 + 原文摘录 + 数据实际值

  # --- 数据划分重复与泄漏 ---
