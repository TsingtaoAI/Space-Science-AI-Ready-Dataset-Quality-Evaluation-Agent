    implemented: false
    missing_materials: 外部事件目录（HEK/LASCO CME 目录/台站事件表）作为对照依据
  - id: M03
    name: 事件身份标识与同批格式一致（疑似虚构标注）
    defect_type: T5
    defect_code: L3-07
    applicability: "声明了身份字段的事件；同批事件 ≥ min_elements"
    boundary: "身份字段未声明，或同批事件不足 / 无占比 ≥ dominant_share 的主流格式 → 不适用"
    dimension: annotation
    remediation: 核对该事件在源事件目录中是否存在；查无此事件的删除，存在的补全正式身份标识
    category: missing_spurious
    evidence_type: computable
    severity: critical
    profiles: [hek_image]
    depends_on: [S05]
    tolerance: {dominant_share: 0.95, min_elements: 100}
    method: >-
      对 events.identity_keys 中每个字段，把取值的字母记作 a、数字记作 9 得到格式型；同批（本数据集）事件中占比
      >= dominant_share 的格式型为主流格式。某事件的身份字段为空、为字符串 "None"/"null"，或格式型与主流格式不同，
      即判为疑似虚构标注（源事件目录中的事件都带正式身份标识）。同批事件少于 min_elements 或没有主流格式时不适用

  - id: M04
    name: 同一标注内无复制的目标（疑似虚构标注）
    defect_type: T5
    defect_code: L3-07
    applicability: "多边形标注；顶点数 ≥ min_vertices 的多边形"
    boundary: "没有顶点数达标的多边形（如五点闭合的 HEK 外接框）→ 不适用"
    dimension: annotation
    remediation: 核对复制出的多边形处是否真有目标；没有的删除
    category: missing_spurious
    evidence_type: computable
    severity: major
    profiles: [epb_segmentation, aurora_shapes]
    depends_on: [S02]
    tolerance: {min_vertices: 6, max_normalized_deviation: 0.01}
    method: >-
      同一标注内两个多边形顶点数相同，各自按外接框归一到 [0, 1]² 后逐点最大偏差 <= max_normalized_deviation，而原始坐标不同
      （位置或大小不同），即后一个是前一个平移缩放得到的复制品，判疑似虚构标注。天然目标（等离子体泡、极光）的边界不会与另一个
      目标逐点相似；公开集干净版本 0 例，P1～P4 依次 13 / 53 / 102 / 164 例

