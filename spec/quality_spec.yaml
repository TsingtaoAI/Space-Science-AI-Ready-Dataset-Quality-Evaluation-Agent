# 空间科学智能就绪数据集质量判定标准（声明式规格）
#
# 规格与实现逐条对应：checks 中每个 id 必须在 src/sqa/checks/ 下有同名实现，
# 或显式标记 implemented: false（运行时落「待判定」，不从分母删除）。
# 启动时校验这一对应关系，不一致直接报错退出。
#
# v0.2.0 依据组委会下发的公开数据（OPC-V34 publish，6 类 × 5 子集）重写。
# v0.3.0 依据《需求说明》与《评分准则》增加质量变体对照（X 类检查）、缺陷程度计量（measures）与全局排序。
# v0.4.0 增加六个评价维度、综合分与等级、关键缺陷不可抵消、G01/U01、整改建议、检查器重试与降级。
# v0.4.1 变体对照按身份字段配对事件（几何被镜像或旋转时仍能配上）；CME 以 cme_time 为事件时刻；新增 X08 标注数值扰动；C01 覆盖 ULF 事件类型。
# v0.5.0 公开集实测发现注入缺陷在质量档间部分嵌套：参考改为「质量序最靠前且有效的版本」；所有同源版本共有的问题降级为待判定；R01 不再比较标签内容；N02 只认填充值的连续段。
# v0.6.1 增加依据材料获取情况，等级标为暂定；判定规则不变。
# v0.6.0 新增单数据集物理一致性判据 V04、B03、B04、C04（无同源版本时仍可检出数值扰动、位置偏移、边界缩放、类别错标）；每项检查标注需求说明书缺陷类型，输出标准化缺陷文件 defects.jsonl。
# v0.9.0 依据闭门路演数据（同一数据集的目录对象互不重叠，只能单数据集评价）与公开集单数据集模式的样本级检出率：
#        新增 C06 类别与数据集定位相符、M04 同一标注内无复制的目标；B02 时序事件只判与文件时间窗完全不相交；
#        C05 不判与数据集定位一致的样本。公开集各干净版本单独运行时计分轨「不通过」为 0。
# 标注为 ASSUMPTION 的条目尚未用全量数据核对。

spec_name: 空间科学智能就绪数据集质量判定标准
rule_version: "0.9.0"

statuses:
  pass:           {zh: 通过,   meaning: 满足要求,                         counts_as_completed: true,  in_denominator: true}
  fail:           {zh: 不通过, meaning: 已确认缺陷,                       counts_as_completed: true,  in_denominator: true}
  pending:        {zh: 待判定, meaning: 依据不足；必须写明缺什么材料,     counts_as_completed: true,  in_denominator: true}
  not_applicable: {zh: 不适用, meaning: 与本数据类型或用途不适用；注明原因, counts_as_completed: false, in_denominator: false}

coverage_invariant: "defects(K) <= completed(N) <= applicable(M)"

verdicts:
  - {id: reject,            zh: 拒绝入库,   when: 任一 critical 检查不通过,                                    action: 整改后重新提交}
  - {id: manual_review,     zh: 转人工复核, when: 任一 critical 检查待判定，或任一 major 检查不通过,           action: 人工按严重度处理标红项}
  - {id: accept_with_marks, zh: 标记后入库, when: 其余情况,                                                    action: 附判定记录入库}

purposes:
  ingest:   {zh: 平台入库, default: true}
  training: {zh: 模型训练}

# ---------------------------------------------------------------------------
# 目录约定（来自公开数据）
#   分目录：<数据集>/label/<数据文件名>.json + <数据集>/data/<数据文件名>
#   平铺：  <数据集>/<id>.json + <数据集>/<id>.<ext>  或  <数据集>/<数据文件名>.json
# 标签与数据靠文件名配对；标签内 fileName 必须与之相符。
# ---------------------------------------------------------------------------
layout:
  label_dirs: [label, labels]
  data_dirs: [data]
  data_extensions: [png, jpg, jpeg, fits, fit, csv, cdf, nc, h5, hdf5, dat, txt, parquet]
  ignore_globs: ["*.py", "*.ipynb", "*.md", "*.pdf", "*.docx", "README*", ".*", "__MACOSX",
                 "dataset_summary*.json", "file_list*.txt"]
  # 发榜方参考代码（OPC-code）显示源端数据集根目录还可能带 file_list.txt 与 dataset_summary.json：
  # 二者不是样本标签或数据，不参与配对；file_list 由 P04 核对，dataset_summary 作为说明文档供 D04 读取
  file_lists: ["file_list*.txt"]

# ---------------------------------------------------------------------------
# 标注族（按标签内容识别，不依赖目录名；目录名在评测集中可能匿名）
# ---------------------------------------------------------------------------
profiles:
  hek_image:
    data_type: 图像
    dataset_type: 图像 · 事件标注型（HEK 事件，外接多边形或单一时刻）
    zh: 太阳图像 · HEK 事件（HMI/AIA 活动区、LASCO C2 日冕物质抛射）
    modality: image
    detect: hek_event_annotation
    events: {block: hek_event_annotation, list: matched_events, count: event_count, has: has_events,
             types: event_types, type_key: event_type, start_key: event_starttime, end_key: event_endtime,
             reference_time: hek_event_annotation.image_time, polygon_key: bbox_polygon_pixel,
             # HEK 按时间窗匹配事件：公开数据中事件起点可比图像时刻晚 1 小时。ASSUMPTION: 待全量数据标定
             match_tolerance_s: 7200,
             # 变体对照时优先按这些身份字段配对同一事件（几何被镜像或旋转时仍能配上）
             identity_keys: [kb_archivid, SOL_standard, solar_object_locator],
             # 没有起止时刻的事件（LASCO CME）以该字段为事件时刻
             point_time_key: cme_time}
    # HEK 事件类型代码与概念名的对应（HEK 官方定义）
    concept_of: {AR: Active Region, CH: Coronal Hole, FL: Flare, CE: CME, CME: CME, SS: Sunspot,
                 FI: Filament, EF: Emerging Flux, SG: Sigmoid, CJ: Coronal Jet}
  ulf_timeseries:
    data_type: 时序
    dataset_type: 时序 · 事件区间标注型（ULF 脉动事件）
    zh: 地磁 ULF 时序（Pi2/Pc 脉动事件）
    modality: timeseries
    detect: ulf_event_annotation
    events: {block: ulf_event_annotation, list: matched_events, count: event_count, has: has_events,
             types: event_types, type_key: kind, start_key: start_dt, end_key: end_dt}
    # ULF 事件类型（地磁脉动分类）。ASSUMPTION: 取自公开数据与 IAGA 脉动分类
    vocabulary: [Pi1, Pi2, Pc1, Pc2, Pc3, Pc4, Pc5]
  aurora_shapes:
    data_type: 图像
    dataset_type: 图像 · 矩形框标注型（DMSP SSUSI 极光）
    zh: 极光图像 · 矩形标注（DMSP SSUSI）
    modality: image
    detect: science_annotation.specialShapes
    shapes: {path: science_annotation.specialShapes}
    image_size: {width: basic_annotation.imageWidth, height: basic_annotation.imageHeight}
    # ASSUMPTION: 类别表取自公开数据；__OOV__ 为标注工具的「词表外」占位符
    vocabulary: [PCA, TPA, unclear]
  epb_segmentation:
    data_type: 图像
    dataset_type: 图像 · 多边形分割型（EPB 等离子体泡）
    zh: 气辉图像 · 等离子体泡分割（EPB）
    modality: image
    detect: science_annotation.mask
    shapes: {path: science_annotation.mask.shapes}
    image_size: {width: science_annotation.mask.imageWidth, height: science_annotation.mask.imageHeight,
                 text: basic_annotation.imgSize}
    vocabulary: [EPB]

# 赛题说明中标签四块的必填字段（所有族通用）
required_fields:
  - {path: label_header, type: object}
  - {path: label_header.fileName, type: string}
  - {path: label_header.labelVersion, type: string}
  - {path: label_header.annotationMethod, type: [string, array]}
  - {path: basic_annotation, type: object}
  - {path: basic_annotation.fileName, type: string}
  - {path: basic_annotation.modality, type: [string, array]}
  - {path: basic_annotation.fileFormat, type: string}
  - {path: science_annotation, type: object}

# 同批对照：某字段在本数据集 >= 该比例的标签中出现，而本条缺失，即判缺失。
# 取 0.75 而非更高：缺陷注入率高的子集里，被删字段的出现比例可能只有 80%~90%
schema_conformity_ratio: 0.75

# 物理量合法范围（超出即判不通过）。依据：日地距离与太阳视半径的年变化范围、
# AIA 观测波段、LASCO CME 目录取值定义、地磁台站量程。
physical_ranges:
  science_annotation.rsunObs:   {min: 935, max: 985, unit: arcsec}
  science_annotation.dsunObs:   {min: 1.46e+11, max: 1.53e+11, unit: m}
  science_annotation.wavelnth:  {allowed: [94, 131, 171, 193, 211, 304, 335, 1600, 1700, 4500, 6173], unit: Angstrom}
  science_annotation.sampling_rate_hz: {min_exclusive: 0, unit: Hz}
  event.width:                  {min: 0, max: 360, unit: deg}
  event.central_pa:             {min: 0, max: 360, unit: deg}
  event.mpa:                    {min: 0, max: 360, unit: deg}
  event.linear_speed:           {min: 0, max: 5000, unit: km/s}
  event.mass:                   {min_exclusive: 0, unit: g}
  event.area_atdiskcenter:      {min_exclusive: 0, unit: km2}
  event.meaninclinationgamma:   {min: 0, max: 90, unit: deg}
  event.meanshearangle:         {min: 0, max: 180, unit: deg}
  event.ar_numspots:            {min: 0, max: 500}
  csv.H:                        {min: -100000, max: 100000, unit: nT}
  csv.Z:                        {min: -100000, max: 100000, unit: nT}
  csv.T:                        {min: -100000, max: 100000, unit: nT}
  # D 声明为磁偏角（度），但公开集与路演数据的干净版本中约三成文件 D 取值达数百，量级更像 nT 或角分：源端单位约定与声明不一致，
  # 不是数据损坏，超出时落待判定并写明需台站元数据确认单位
  csv.D:                        {min: -180, max: 180, unit: deg, on_violation: pending,
                                 reason: "数值量级与声明单位（度）矛盾，疑为源端单位约定不同（nT 或角分）", missing: "台站元数据中 D 分量的单位定义"}

# 统计离群（不判不通过，只落待判定）：对数尺度上相对本数据集中位数的稳健 z 分数
outlier:
  robust_z: 8.0
  min_samples: 30

time_tolerance_s: 1

# 物理一致性判据的容差（依据公开集最干净版本的实测分布，并留余量）
physics:
  kinetic_energy_tolerance: 0.15     # 干净数据 p1～p99 为 ±5.3%
  limb_margin: 1.05                  # 干净数据最远 1.01 个日面半径
  plate_scale_arcsec: {with_wavelength: 0.6, without_wavelength: 0.504}   # AIA / HMI 全分辨率像素尺度
  reference_width_px: 4096          # 像素尺度对应的全分辨率宽度；图像中心与尺度按实际尺寸换算
  area_ratio_range: [1.0, 10.0]      # 干净数据 1.14～8.99

# 时序数据：只把这些值的长连续段视为「缺失被填充」（物理量本身缓变时数值可长时间不变，不算缺陷）
timeseries:
  fill_values: [0, -999, -9999, 9999, 99999, 999999, -1.0e+31]
  min_fill_run: 60          # 连续段长度同时须 >= 该值且 >= 总点数的 10%

# ---------------------------------------------------------------------------
# 缺陷类别（基线缺陷清单 9 类）
# ---------------------------------------------------------------------------
defect_categories:
  - {id: file_pairing,        zh: 文件配对与引用}
  - {id: value_validity,      zh: 标注数值合法性}
  - {id: structure,           zh: 标注结构自洽}
  - {id: category_error,      zh: 类别标注错误}
  - {id: missing_spurious,    zh: 漏标与虚标}
  - {id: boundary_offset,     zh: 边界与位置偏差}
  - {id: value_perturbation,  zh: 数值扰动}
  - {id: doc_mismatch,        zh: 文档与内容不一致}
  - {id: split_leakage,       zh: 数据划分重复与泄漏}

# 依据材料获取情况（需求说明书第四节承诺提供；未获取的材料不臆造，相关阈值标为暂定）
reference_materials:
  - {name: 需求说明书, status: 已获取}
  - {name: 评分标准（对外版 GUIDE-A）, status: 已获取}
  - {name: 公开数据集（OPC-V34，30 个数据集）, status: 已获取}
  - {name: OPC 评测细则（计分方法、比较分组、误差容限）, status: 未获取}
  - {name: 关键缺陷清单, status: 未获取, affects: 关键缺陷暂按 severity=critical 的检查认定}
  - {name: 参考样例与锚点样例（高 / 中 / 低质量示例）, status: 未获取}
  - {name: 质量版本的档位 / 等级标签, status: 未获取, affects: 等级阈值为暂定值，未经档位标定}
  - {name: 字段字典、标注定义、划分清单、版本与用途说明、使用权限信息, status: 未获取, affects: 类别表取自公开数据；使用条件维度证据不足}

# 需求说明书第三节列出的缺陷类型（标准化缺陷文件 defects.jsonl 按此分类）
defect_types:
  T1: 文件缺失、损坏或配对错误
  T2: 样本重复
  T3: 标注引用错误
  T4: 类别错标
  T5: 目标漏标与虚标
  T6: 事件边界或分割位置偏移
  T7: 数据划分中的重复与泄漏
  T8: 标注数值合法性
  T9: 标注结构自洽
  T10: 说明文档与数据内容一致性

# ---------------------------------------------------------------------------
# 检查项
#   evidence_type: computable | reference | undeterminable
#   severity:      critical | major | minor
#   profiles:      适用标注族；[any] 表示全部
#   depends_on:    前置检查；前置未通过的记录在本检查中落待判定
# ---------------------------------------------------------------------------
# 缺陷代码：与发榜方《评分标准》附件一 A3「污染项目类型」一一对齐；E- 开头为本规范补充的类型
# （需求说明书列为必检、或本规范需要统计，但附件一未单列）。每条结论的 defectType 取自本表。
#   track: scoring          计分轨：可仅凭数据与标注判定，正常输出「不通过」
#          non_reproducible 非计分轨（不可重推）：需外部基准方可判定，一律弃报——不输出「不通过」，
#                           改落「待判定」并写明「本项判不了，需补充基准材料」（评分标准 §2.9、附件一 A3）
#          supplementary    本规范补充：可确定性判定，正常输出
#   scoring_profiles：对列出的标注族按计分轨处理（附件一：L2-M 在 ULF 上可凭内部矛盾判定，在 CME 上须真值复算）
defect_codes:
  L0-01:  {zh: 数据文件缺失,          track: scoring, requirement: T1, definition: 标注存在，而其对应的数据文件缺失}
  L0-03:  {zh: 孤儿标注,              track: scoring, requirement: T1, definition: 标注存在，而无任何对应的数据文件}
  L2-G:   {zh: 边界与位置偏差,        track: scoring, requirement: T6, definition: 标注的边界框或掩膜顶点位置与实际目标不符}
  L2-P:   {zh: 类别标注错误,          track: scoring, requirement: T4, definition: 标注的类别标签被置换为错误类别}
  L2-T:   {zh: 时段起止时刻抖动,      track: scoring, requirement: T6, definition: 标注的起止时刻被加性扰动，与数据体时刻矛盾}
  L2-F:   {zh: 元数据尺寸矛盾,        track: scoring, requirement: T10, definition: 标注中的图像尺寸字段与实际图像尺寸不一致}
  L3-06:  {zh: 漏标,                  track: scoring, requirement: T5, definition: 目标实际存在但未被标注}
  L3-07:  {zh: 虚标,                  track: scoring, requirement: T5, definition: 标注了某目标但图像中并不存在}
  L3-MIS: {zh: 覆盖不足 / 覆盖过度,   track: scoring, requirement: T6, definition: 标注范围相对实际目标偏小或偏大}
  L2-A:   {zh: 标量数值扰动,          track: non_reproducible, requirement: T8, definition: 标注中物理量数值被加性或乘性扰动}
  L2-B:   {zh: 结构参数失配,          track: non_reproducible, requirement: T8, definition: 标注中结构参数间的关系被破坏}
  L2-C:   {zh: 角度循环抖动,          track: non_reproducible, requirement: T8, definition: 标注中的角度值被循环平移}
  L2-M:   {zh: 元数据 / 参数失配,     track: non_reproducible, scoring_profiles: [ulf_timeseries], requirement: T10,
           definition: 标注记录的参数与数据体实际情况不符}
  L1-TS:  {zh: 时序断裂 / 重复,       track: non_reproducible, requirement: T1, definition: 时序数据中出现连续段的删除或重复}
  E-STR:  {zh: 标注结构不自洽,        track: supplementary, requirement: T9, definition: 标签无法解析、缺少必填字段或计数与明细矛盾}
  E-REF:  {zh: 标注引用错误,          track: supplementary, requirement: T3, definition: 标签引用的文件名与实际文件不对应，或数据文件无标签}
  E-VAL:  {zh: 标注数值不合法,        track: supplementary, requirement: T8, definition: 时刻无法解析或起止颠倒等确定性非法值}
  E-COR:  {zh: 数据文件损坏或被改动,  track: supplementary, requirement: T1, definition: 数据文件无法读取、文件头损坏或内容与同源版本不一致}
  E-DUP:  {zh: 样本重复,              track: supplementary, requirement: T2, definition: 数据文件内容与另一文件完全相同}
  E-SPL:  {zh: 数据划分重复与泄漏,    track: supplementary, requirement: T7, definition: 训练与测试划分中出现同一样本或同一事件的重叠窗口}
  E-DOC:  {zh: 说明文档与数据不一致,  track: supplementary, requirement: T10, definition: 声明的格式、模态、时刻等与数据内容不符}
  E-COV:  {zh: 类别分布偏移,          track: supplementary, requirement: T5, definition: 类别分布相对同源版本参考分布偏离超出容差}
  E-USE:  {zh: 使用条件缺失,          track: supplementary, requirement: T10, definition: 缺少使用权限、许可或用途说明}

# 不可重推检查项的处理（评分标准 §2.9、交付材料清单 §6.5「不可重推的检查项：检出率须受控，超阈值必须弃报」）。
# 本规范取最严格的做法：判据给出的提示一律落「待判定」，不输出「不通过」；提示数量与位置保留在证据中供人工复核。
non_reproducible:
  action: abstain
  statement: 本项判不了，需补充基准材料
  materials:
    L2-A: 原始观测值或权威事件目录中对应记录的数值（如 HEK / CDAW 原始记录）
    L2-B: 结构参数的原始测量记录（如 CDAW LASCO CME 目录中的质量、速度、动能）
    L2-C: 角度量的原始测量记录
    L2-M: 原始文件头或处理记录（定标参数、采样设置）
    L1-TS: 原始台站时序数据或其校验和

# 声明字段 → 缺陷代码（X07 等定位到具体字段的结论按此细分；自上而下取第一条匹配，正则匹配字段路径）
field_defect_codes:
  - {match: '(imageWidth|imageHeight|imgSize)$', code: L2-F}
  - {match: '^basic_annotation\.(startTime|endTime)$', code: L2-T}
  - {match: '^science_annotation\.(n_points|sampling_rate_hz|duration_s|units|components)$', code: L2-M}
  - {match: '\.(event_types|event_count|has_events)$', code: L2-P}

checks:
  # --- 标注结构自洽 ---
  - id: S01
    name: 标签 JSON 严格可解析
    defect_type: T9
    defect_code: E-STR
    applicability: "每个标签文件；须能读取文件字节"
    boundary: "—（任何可读文件都能判定）"
    dimension: correspondence
    remediation: 按标准 JSON 重新导出标签（UTF-8、无重复键、无 NaN），解析失败的样本暂不入库
    category: structure
    evidence_type: computable
    severity: critical
    profiles: [any]
