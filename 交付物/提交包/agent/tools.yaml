# 由 tools/gen_agent_registry.py 依据 spec/quality_spec.yaml 与检查器注册表生成，请勿手改
tools:
- name: sqa.checks.structure
  title: 标注结构检查器
  version: 0.8.0
  entry: python -m sqa run（镜像 /app/src/sqa/checks/structure.py，由编排层按检查编号调用）
  purpose: 严格解析标签、识别标注族、校验必填字段与同批结构、事件计数与类型汇总
  inputSchema:
    dataset: DatasetContext：数据集根目录、标签记录、数据文件清单、已解析标签与前置检查结论
    record: 单条标签记录（scope=record 时）
    group: null
  outputSchema: 每个单元一条结论：unit、status（通过/不通过/待判定/不适用）、findings[location, message, evidence]
  timeout: 不单设；整次运行受评测端单数据集 3 小时上限约束（公开集全量实测约 12 分钟）
  retryLimit: 1
  failureModes:
  - 检查器抛出异常：按 retryLimit 重试，仍失败则该单元落待判定并记运行日志（不记为不适用）
  - 前置检查未通过：不执行，落待判定并写明先修复的检查
  checkIds:
  - S01
  - S02
  - S03
  - S04
  - S05
  - S06
  scope:
  - record
  deterministic: true
  resources:
    cpu: 单进程
    accelerator: 不需要
    network: 不需要
