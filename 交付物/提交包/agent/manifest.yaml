# 由 tools/gen_agent_registry.py 依据 spec/quality_spec.yaml 与检查器注册表生成，请勿手改
agent:
  name: 空间科学智能就绪数据集质量评价智能体
  version: 0.8.0
  ruleVersion: 0.8.0
  paradigm: pipeline
modelToolWhitelist: []
modelToolWhitelistNote: 编排为确定性流水线；--use-llm 时两个子代理只接收文本、返回文本，不调用任何工具
decisionPoints:
- id: DP1
  name: 标注族识别
  trigger: 每条标签解析成功后
  input: 标签 JSON
  output: profile 名或 None
  fallback: 识别不出：该记录相关检查落待判定（R01）
- id: DP2
  name: 检查适用性
  trigger: 每个检查执行前
  input: 数据集标注族、用途、检查的 profiles/purposes
  output: 适用 / 整项不适用（附原因）
  fallback: 无法确定时逐条执行，不整项排除
- id: DP3
  name: 前置依赖
  trigger: 每个单元执行前
  input: depends_on 中检查在该单元的结论
  output: 执行 / 落待判定
  fallback: R01
- id: DP4
  name: 同源版本分组与参考版本
  trigger: 全部单数据集检查完成后
  input: 同标注族数据集的样本名集合、独立检查的不通过单元数
  output: 版本组、质量序、逐样本参考内容
  fallback: 组内少于 3 个版本或无有效参考：差异落待判定
- id: DP5
  name: 缺陷代码与弃报
  trigger: 输出结论前
  input: 检查编号、标注族、结论证据
  output: 缺陷代码；不可重推者改落待判定
  fallback: R05
- id: DP6
  name: 汇总与排序
  trigger: 全部结论确定后
  input: 逐检查结论、规格中的指标与权重
  output: 维度分、综合分、等级、质量预测、全局排序
  fallback: 证据不足的维度不计分（R06）；同分不并列（R09）
deterministicBoundary:
- step: 数据读取、解析、校验
  model: 不允许
  implementation: 确定性程序
- step: 数值计量（比例、偏移、统计量）
  model: 不允许
  implementation: 确定性程序
- step: 适用性判定
  model: 允许但未使用
  implementation: 确定性程序（DP2）
- step: 缺陷判定与分类
  model: 允许，须给出证据位置
  implementation: 确定性程序；--use-llm 时子代理只从说明文档抽取声明（附原文摘录作为证据位置），判定仍由程序比对完成（D04）
- step: 严重程度判断
  model: 允许但未使用
  implementation: 确定性程序（规格 severity_axes）
- step: 维度得分与综合排序
  model: 不允许
  implementation: 确定性程序（规格 scoring）
orchestration:
  mainLoop:
  - 发现数据集
  - 按质量版本组预分组
  - 组内逐数据集执行单数据集检查（按依赖拓扑序）
  - 组内版本对照
  - 降级共有与参考版本问题
  - 不可重推项弃报
  - 生成报告与评分
  - 全局排序与交付物输出
  concurrency: 按质量版本组多进程并行；进程数 = min(组数, 容器可用 CPU 数)，可用 --workers 指定
  state: 进程内存；结果只写输出目录
  context: 每个数据集一个上下文对象，组间不共享
seeds:
  global: 0
  sampling: null
  note: 全程确定性，不抽样
runtime:
  base: python:3.11.9-slim-bookworm
  dependencies:
    PyYAML: 6.0.2
  processModel: 主进程 + 每个质量版本组一个工作进程
  isolation: Docker 容器，--network none，输入只读挂载
guardrails:
  writeWhitelist:
  - /output
  network: 不访问；评测时以 --network none 运行
  process: 只创建本程序的工作进程
  quotas:
    workers: ≤ 可用 CPU 数
    retryLimit: 1
    modelTokens: 0
  auditHooks:
  - 启动与镜像构建时校验规格与实现逐条对应（不一致拒绝运行）
  - 每个检查的开始、结束、重试、失败、降级写入 run.log.jsonl
  - 00_MANIFEST.yaml 记录全部输出文件的 SHA-256
subAgents:
- name: doc_claim_extractor
  enabledBy: --use-llm 且数据集目录中有说明文档
  responsibility: 读说明文档，抽取可核对的声明（样本数、类别、时段、尺寸、模态）
  inputContract: 文档正文（最多 20000 字符）+ 规格 llm.prompts.doc_claim_extractor
  outputContract: '{"claims": [{"field", "value", "quote"}]}，quote 为文档原文摘录'
  delegationCondition: D04 执行且模型服务可用
  checkIds:
  - D04
  contextIndependent: true
  producesEvidence: 只产出声明与原文摘录；不通过的结论由 D04 的比对程序产出
  arbitration: 同一文档调用 2 次，只采用完全一致的声明；不一致落待判定；摘录在文档中找不到的声明丢弃；与规则结论冲突时以规则为准（模型不出结论）
- name: remediation_writer
  enabledBy: --use-llm
  responsibility: 把评分卡主要缺陷的整改建议改写得更具体、可执行
  inputContract: 检查名称、缺陷类型、数量、示例说明、规格中的通用整改建议 + llm.prompts.remediation_writer
  outputContract: 不超过 80 字的整改步骤正文
  delegationCondition: 全部结论确定之后
  checkIds: []
  contextIndependent: true
  producesEvidence: 否：只写入评分卡 remediationDetail 字段
  arbitration: 不参与任何判定与计分；调用失败则保留规格中的通用整改建议
subAgentsNote: 两个子代理均默认关闭（模型服务消耗 0）；只负责读文档与改写表述，计量、判定、计分、排序全部由确定性程序完成
